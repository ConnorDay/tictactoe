services:
  back:
    build: ./back
    command: npm run devStart
    ports:
      - 8000:3000
    develop:
      watch:
        - action: rebuild
          path: ./back/src
          target: /app
  front:
    build: ./front
    command: npm run dev
    develop:
      watch:
        - action: sync
          path: ./front/app
          target: /app
          ignore:
            - node_modules/
  nginx:
    image: nginx:latest
    ports:
      - 4000:80
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf